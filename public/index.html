<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hayalet Mentor</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <img id="characterAvatar" class="header-avatar" src="" alt="Avatar" />
        <div class="header-info">
          <div class="title" id="characterName">Hayalet Mentor</div>
          <p id="characterDesc" class="character-desc"></p>
        </div>
      </div>
      <div class="selectors">
        <select id="figure"></select>
        <button id="clearHistory" class="icon-btn" title="Gecmisi Temizle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
        <button id="themeToggle" class="icon-btn">
          <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <main id="chat">
      <div class="empty-state" id="emptyState">
        <div class="empty-state-icon">💭</div>
        <p class="empty-state-text">Sohbete baslamak icin bir soru sorun</p>
      </div>
    </main>

    <footer>
      <textarea id="userInput" placeholder="Mesajinizi yazin..." rows="1"></textarea>
      <button id="sendBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </footer>
  </div>

  <div id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
